[project]
name = "huckdeck"
version = "0.1.0"
description = "Stream-deck-style button device that logs baby events to Huckleberry"
readme = "README.md"
authors = [
    { name = "Chris Williams", email = "chriscancodethat@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huckleberry-api>=0.4.3",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Pi-only: on Raspberry Pi OS install apt packages python3-dev, swig,
# liblgpio-dev first (lgpio builds from source), then `uv sync --extra pi`.
pi = [
    "gpiozero>=2.0.1.post3",
    "lgpio>=0.2.2 ; sys_platform == 'linux'",
    "luma.oled>=3.13.0 ; sys_platform == 'linux'",
    "spidev>=3.6 ; sys_platform == 'linux'",  # luma.core no longer pulls it in itself
]
# Ribbon display rendering (browser simulator now, OLED on the Pi later).
display = [
    "pillow>=12.0.0",
]

[project.scripts]
huckdeck = "huckdeck.main:run"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
