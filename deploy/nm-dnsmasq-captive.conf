# Captive portal DNS for the setup hotspot. NetworkManager runs dnsmasq for
# "shared" connections and reads this directory; answering every name with
# the deck's address sends phones' connectivity probes to the setup page,
# which pops the sign-in sheet. Only affects the hotspot, never the home LAN.
# Installed to /etc/NetworkManager/dnsmasq-shared.d/huckdeck-captive.conf
address=/#/10.42.0.1
# The deck has no upstream DNS while it's the hotspot; don't look for one.
no-resolv
