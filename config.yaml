# huckdeck configuration

# Optional: pin a specific child by cid. Leave blank to use the first child
# on the account (a warning is printed if there is more than one).
child_uid: ""

# Defaults applied when the bottle button is pressed.
bottle:
  amount: 120
  units: ml            # ml or oz
  type: Formula        # Formula, Breast Milk, Cow Milk, ...

# Which side a nursing session starts on: left or right.
nursing:
  start_side: left

# Ignore a repeat press of the same button within this many seconds.
debounce_seconds: 2

# Input source: keyboard (terminal prototype) or gpio (Pi). The --input CLI
# flag overrides this.
input: keyboard

# Ribbon display (256x64 SSD1322 OLED). driver: none, sim (browser preview at
# http://localhost:<sim_port>/, needs `uv sync --extra display`) or oled (the
# panel on the Pi's SPI0, pins under gpio: display:; only used with gpio
# input, so keyboard runs on a laptop ignore it). The --display CLI flag
# overrides the driver.
display:
  driver: oled
  sim_port: 8765
  mode: ticker           # ticker (scrolling line) or panes (static layout)
  brightness: 80         # 0-255, for dim_after_seconds after a button press
  dim_brightness: 20     # 0-255, the rest of the time
  dim_after_seconds: 60
  ticker_speed: 24       # pixels per second
  day_starts_at: 8       # today's totals count from 8am to 8am

# Input key -> event. Events: pee, poo, both, bottle, sleep_toggle, nursing_toggle.
buttons:
  "1": pee
  "2": poo
  "3": both
  "4": bottle
  "5": sleep_toggle
  "6": nursing_toggle

# Pi wiring (BCM pin numbers). Buttons wire to ground, internal pull-ups.
gpio:
  buttons:
    "5": pee
    "6": poo
    "13": both
    "19": bottle
    "26": sleep_toggle
    "16": nursing_toggle
  led:            # 5mm common-cathode RGB LED via 330 ohm resistors
    red: 17
    green: 27
    blue: 22
  display:        # SSD1322 on SPI0 CE0 (MOSI 10, SCLK 11, CS 8) plus:
    dc: 24
    rst: 25
